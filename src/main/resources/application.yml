spring:
  application:
    name: codefreex
  profiles:
    active: local
  session:
    store-type: redis
    timeout: 1800
  devtools:
    restart:
      enabled: false
server:
  port: 18123
  servlet:
    context-path: /api
# MyBatis-Flex
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    logic-delete-column: is_delete
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: cn.wanyj.codefreex.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# Dubbo RPC
dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
  consumer:
    timeout: 5000
    check: false
    retries: 0
# 认证授权服务（auth-service）集成参数，实际值在 profile 中配置
auth-service:
  tenant-uid: ${AUTH_SERVICE_TENANT_UID:}
  rpc-token: ${AUTH_SERVICE_RPC_TOKEN:}
  frontend-url: ${AUTH_SERVICE_FRONTEND_URL:http://localhost:5173}
# LangChain4j OpenAI 配置（主生成模型 - 流式，敏感信息在 application-local.yml 中配置）
langchain4j:
  open-ai:
    streaming-chat-model:
      temperature: 0.7
      max-tokens: 131072
      log-requests: false
      log-responses: false
# AI 自定义配置
ai:
  review:
    temperature: 0.3
    # 预审核模型同时承担迭代修改的工具调用循环；该模型为深度推理型，
    # 修改大文件仅推理即可消耗 ~7K token，上限过小会在输出 tool_calls 前被 length 截断（表现为空回复）
    max-tokens: 32768
    # 推理型模型长推理单次调用可超过 60s，放宽同步调用超时
    timeout: 5m
  prompts-dir: classpath:prompts/
# Actuator + Prometheus 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        ai_model_call_duration: true
      slo:
        ai_model_call_duration: 1s,3s,5s,10s,30s,60s,120s,180s,300s
  prometheus:
    metrics:
      export:
        enabled: true
app:
  nginx:
    enabled: false
    reload-on-deploy: false
    server-name-suffix: .local
  screenshot:
    enabled: true
    browser: edge
    page-load-timeout-seconds: 20
    render-wait-millis: 1500
  workflow:
    max-quality-retry: 2
    vue-build-enabled: true
    # 页面冒烟检测：HTML/多文件产物质检时用无头浏览器采集 JS 运行错误（浏览器缺失时自动跳过）
    smoke-test-enabled: true
    npm-command: npm
    image-fetch-enabled: false
